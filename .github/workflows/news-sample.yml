# Collects a fresh time-machine sample WITH GDELT headlines, for the news
# re-baseline of the forecaster. GDELT rate-limits the developer network to
# uselessness, so this runs on an Actions runner instead.
#
# No OpenAI key is used here: this only collects markets, prices at T,
# revision-pinned Wikipedia events and GDELT headlines seen before T. The
# forecasts (`backtest.py predict`) are a separate, deliberate step.
#
# GDELT's DOC API only searches roughly the last three months, so the sample is
# markets that closed recently -- all of them after gpt-5.6-luna's 2026-02-16
# knowledge cutoff. The probe step prints how many articles an old and a recent
# window return, which is how to tell a dead channel from a quiet one.
#
# Triggered by pushing to the `news-sample` branch (or manually once this file
# is on main). The collect stage appends and is resumable: a rerun continues
# where the last one stopped. Results are committed back to the same branch.

name: news-sample

on:
  push:
    branches: [news-sample]
  workflow_dispatch:
    inputs:
      target:
        description: "markets to collect (total, including already collected)"
        default: "400"
      start_date:
        description: "earliest market end date (GDELT reaches back ~3 months)"
        default: "2026-07-15"
      end_date:
        description: "latest market end date"
        default: "2026-10-05"

concurrency:
  group: news-sample-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    env:
      TARGET: ${{ inputs.target || '400' }}
      START_DATE: ${{ inputs.start_date || '2026-07-15' }}
      END_DATE: ${{ inputs.end_date || '2026-10-05' }}
      SAMPLE_DIR: data/backtest/news

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-forward.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-forward.txt

      - name: Probe GDELT from this runner
        run: |
          for window in "20260720000000 20260727000000" "20260929000000 20261006000000"; do
            set -- $window
            code=$(curl -s -m 30 -o probe.json -w "%{http_code}" \
              "https://api.gdeltproject.org/api/v2/doc/doc?query=Bitcoin&mode=artlist&format=json&maxrecords=10&startdatetime=$1&enddatetime=$2")
            n=$(python -c "import json;print(len(json.load(open('probe.json')).get('articles',[])))" 2>/dev/null || echo "unparseable")
            echo "GDELT $1..$2 -> HTTP $code, articles=$n"
            sleep 12
          done

      # 300 minutes leaves time to commit before the job timeout. The collect
      # writes each market as it goes, so a timeout keeps everything so far.
      - name: Collect sample with headlines
        run: |
          set +e
          timeout 300m python scripts/backtest.py collect \
            --data-dir "$SAMPLE_DIR" --target "$TARGET" \
            --start-date "$START_DATE" --end-date "$END_DATE" \
            --min-volume 20000 --hours-before 24
          status=$?
          echo "collect exit $status (124 = stopped at the time budget; rerun to resume)"
          python - <<'EOF'
          import json, os
          rows = [json.loads(l) for l in open(os.environ["SAMPLE_DIR"] + "/markets.jsonl")]
          with_news = sum(1 for r in rows if r["headlines"])
          print(f"{len(rows)} markets, {with_news} with headlines "
                f"({with_news / max(len(rows), 1):.0%}), "
                f"{sum(1 for r in rows if r['wiki_events'])} with wiki events")
          EOF

      - name: Commit sample
        if: ${{ !cancelled() }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f "$SAMPLE_DIR/markets.jsonl" ] || { echo "no sample file"; exit 0; }
          git add -- "$SAMPLE_DIR/markets.jsonl"
          if git diff --cached --quiet; then
            echo "nothing collected"
            exit 0
          fi
          git commit -m "news sample $(date -u +%Y-%m-%d)"
          git push origin "HEAD:$BRANCH"
