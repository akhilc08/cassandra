<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cassandra forward test</title>
<style>
/* ============================================================================
   Cassandra forward-test dashboard.
   Single self-contained file. No external requests (a strict CSP would block
   them, and GitHub Pages serves this next to its own data files).

   Design position lives in DESIGN.md. The short version: this is a scientific
   instrument, not a trading terminal, and on most days it has nothing to show.
   So the page is built around liveness and uncertainty, not a hero P&L number,
   and it is ruled hairlines rather than cards because cards look like empty
   scaffolding when the log is empty.
   ============================================================================ */

:root {
  --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  /* True low-chroma neutrals, tinted a hair toward the accent hue.
     Deliberately not the cream/sand band. */
  --bg:         oklch(0.985 0.0015 265);
  --surface:    oklch(1 0 0);
  --surface-2:  oklch(0.972 0.003 265);
  --inset:      oklch(0.958 0.004 265);

  --rule:        oklch(0.905 0.005 265);
  --rule-strong: oklch(0.800 0.008 265);

  --ink:   oklch(0.235 0.013 268);
  --ink-2: oklch(0.448 0.012 268);
  --ink-3: oklch(0.560 0.010 268);

  --accent:     oklch(0.505 0.155 262);
  --accent-dim: oklch(0.930 0.030 262);

  --ok:      oklch(0.480 0.130 152);
  --ok-dim:  oklch(0.930 0.040 152);
  --warn:    oklch(0.505 0.120 70);
  --warn-dim:oklch(0.940 0.050 75);
  --danger:  oklch(0.495 0.195 27);
  --danger-dim: oklch(0.938 0.038 27);

  --fs-page:    1.25rem;
  --fs-section: 0.9375rem;
  --fs-body:    0.875rem;
  --fs-label:   0.75rem;
  --fs-micro:   0.6875rem;

  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 72px;

  --r-sm: 4px; --r-md: 7px; --r-pill: 999px;

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --dur: 180ms;

  --z-sticky: 10;

  --maxw: 1180px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:         oklch(0.166 0.008 265);
    --surface:    oklch(0.202 0.009 265);
    --surface-2:  oklch(0.232 0.010 265);
    --inset:      oklch(0.252 0.011 265);

    --rule:        oklch(0.312 0.012 265);
    --rule-strong: oklch(0.430 0.016 265);

    --ink:   oklch(0.955 0.004 265);
    --ink-2: oklch(0.775 0.008 265);
    --ink-3: oklch(0.660 0.009 265);

    --accent:     oklch(0.775 0.120 262);
    --accent-dim: oklch(0.290 0.055 262);

    --ok:      oklch(0.800 0.135 152);
    --ok-dim:  oklch(0.275 0.050 152);
    --warn:    oklch(0.845 0.130 80);
    --warn-dim:oklch(0.290 0.052 70);
    --danger:  oklch(0.750 0.155 27);
    --danger-dim: oklch(0.300 0.075 27);
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--fs-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

a { color: var(--accent); }
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--sp-5); }

/* ---------- masthead ---------------------------------------------------- */

.masthead {
  display: flex; align-items: baseline; gap: var(--sp-3);
  flex-wrap: wrap;
  padding: var(--sp-6) 0 var(--sp-4);
}
.masthead h1 {
  margin: 0; font-size: var(--fs-page); font-weight: 600;
  letter-spacing: -0.011em;
}
.masthead .sub {
  color: var(--ink-3); font-size: var(--fs-label);
  font-family: var(--font-mono);
  min-width: 0; overflow-wrap: anywhere;
}

/* ---------- heartbeat: the loudest element on the page ------------------- */

.heartbeat {
  display: flex; align-items: center; gap: var(--sp-4);
  flex-wrap: wrap;
  padding: var(--sp-4) var(--sp-5);
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  background: var(--surface);
}
.heartbeat[data-state="warn"]   { border-color: var(--warn);   background: var(--warn-dim); }
.heartbeat[data-state="dead"]   { border-color: var(--danger); background: var(--danger-dim); }

.hb-dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--ok); flex: none;
  position: relative;
}
.hb-dot::after {
  content: ""; position: absolute; inset: -5px;
  border-radius: 50%; border: 1px solid var(--ok);
  opacity: 0; animation: ping 2.4s var(--ease) infinite;
}
.heartbeat[data-state="warn"] .hb-dot { background: var(--warn); }
.heartbeat[data-state="warn"] .hb-dot::after { border-color: var(--warn); }
.heartbeat[data-state="dead"] .hb-dot { background: var(--danger); }
.heartbeat[data-state="dead"] .hb-dot::after { animation: none; opacity: 0; }

@keyframes ping {
  0%   { opacity: 0.9; transform: scale(0.6); }
  70%  { opacity: 0;   transform: scale(1.5); }
  100% { opacity: 0;   transform: scale(1.5); }
}

.hb-verdict {
  font-weight: 600; font-size: var(--fs-body);
  letter-spacing: 0.02em;
}
.heartbeat[data-state="live"] .hb-verdict { color: var(--ok); }
.heartbeat[data-state="warn"] .hb-verdict { color: var(--warn); }
.heartbeat[data-state="dead"] .hb-verdict { color: var(--danger); }

.hb-detail { color: var(--ink-2); min-width: 0; flex: 1 1 240px; }
.hb-detail b { color: var(--ink); font-weight: 600; }
.hb-spacer { flex: 1 1 auto; }

.hb-meta {
  display: flex; gap: var(--sp-5); flex-wrap: wrap;
  font-size: var(--fs-label); color: var(--ink-3);
}
.hb-meta span b {
  display: block; color: var(--ink); font-weight: 600;
  font-family: var(--font-mono); font-size: var(--fs-body);
}

/* ---------- mode banner -------------------------------------------------- */

.mode {
  display: flex; align-items: flex-start; gap: var(--sp-3);
  margin-top: var(--sp-3);
  padding: var(--sp-3) var(--sp-5);
  border: 1px dashed var(--rule-strong);
  border-radius: var(--r-md);
  color: var(--ink-2);
  font-size: var(--fs-label);
}
#mode-text { min-width: 0; overflow-wrap: anywhere; }
.mode[data-mode="official"] {
  border-style: solid;
  border-color: var(--accent);
  background: var(--accent-dim);
  color: var(--ink);
}
.badge {
  flex: none;
  font-family: var(--font-mono); font-size: var(--fs-micro);
  font-weight: 600; letter-spacing: 0.09em;
  padding: 2px 7px; border-radius: var(--r-pill);
  border: 1px solid currentColor;
}
.mode[data-mode="shadow"]   .badge { color: var(--ink-3); }
.mode[data-mode="official"] .badge { color: var(--accent); }

/* ---------- sections ----------------------------------------------------- */

section { padding: var(--sp-6) 0 0; }
.sec-head {
  display: flex; align-items: baseline; gap: var(--sp-2) var(--sp-3); flex-wrap: wrap;
  padding-bottom: var(--sp-3);
  border-bottom: 1px solid var(--rule-strong);
  margin-bottom: var(--sp-4);
}
.sec-head h2 {
  margin: 0; font-size: var(--fs-section); font-weight: 600;
  letter-spacing: -0.006em;
}
.sec-head .note { color: var(--ink-3); font-size: var(--fs-label); }
.sec-head .grow { flex: 1 1 auto; }

/* ---------- interval bars: the honest primitive -------------------------- */

.arm { padding: var(--sp-3) 0 var(--sp-4); border-bottom: 1px solid var(--rule); }
.arm:last-child { border-bottom: 0; }

.arm-top {
  display: flex; align-items: baseline; gap: var(--sp-3);
  flex-wrap: wrap; margin-bottom: var(--sp-3);
}
.arm-name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.arm-name .qual { color: var(--ink-3); font-weight: 400; font-size: var(--fs-label); }
.arm-stats {
  margin-left: auto; display: flex; gap: var(--sp-5); flex-wrap: wrap;
  font-size: var(--fs-label); color: var(--ink-3);
}
.arm-stats b {
  color: var(--ink); font-weight: 600;
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
}

.axis { position: relative; height: 54px; }
.axis-line {
  position: absolute; left: 0; right: 0; top: 30px;
  height: 1px; background: var(--rule);
}
.zero {
  position: absolute; top: 14px; bottom: 14px; width: 1px;
  background: var(--rule-strong);
}
.zero::after {
  content: "0"; position: absolute; top: 100%; left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-mono); font-size: var(--fs-micro);
  color: var(--ink-3);
}
.band {
  position: absolute; top: 23px; height: 15px;
  border-radius: var(--r-sm);
  background: var(--accent-dim);
  border: 1px solid var(--accent);
}
.band[data-straddles="yes"] {
  /* interval crosses zero: render provisional, never as a verdict */
  background: repeating-linear-gradient(
    135deg, transparent 0 3px, var(--warn-dim) 3px 7px);
  border-color: var(--warn);
}
.band[data-mode="shadow"] { border-style: dashed; }
.tick {
  position: absolute; top: 17px; height: 27px; width: 2px;
  background: var(--ink); border-radius: 1px;
}
.tick-label {
  position: absolute; top: -2px; transform: translateX(-50%);
  font-family: var(--font-mono); font-size: var(--fs-label);
  font-weight: 600; white-space: nowrap;
}
.axis-ends {
  display: flex; justify-content: space-between; gap: var(--sp-3);
  font-family: var(--font-mono); font-size: var(--fs-micro);
  color: var(--ink-3); margin-top: var(--sp-1);
}

.pending {
  padding: var(--sp-3) 0 var(--sp-4); color: var(--ink-2);
}
.pending .lead { color: var(--ink); font-weight: 600; margin-bottom: var(--sp-1); }

/* ---------- filters ------------------------------------------------------ */

.filters {
  display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center;
  margin-bottom: var(--sp-3);
}
.chip {
  font: inherit; font-size: var(--fs-label);
  padding: 4px 10px; border-radius: var(--r-pill);
  border: 1px solid var(--rule-strong);
  background: var(--surface); color: var(--ink-2);
  cursor: pointer;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease),
              border-color var(--dur) var(--ease);
}
.chip:hover { border-color: var(--ink-3); color: var(--ink); }
.chip[aria-pressed="true"] {
  background: var(--ink); color: var(--bg); border-color: var(--ink);
}
.chip .n { font-family: var(--font-mono); opacity: 0.65; margin-left: 4px; }

.search {
  font: inherit; font-size: var(--fs-label);
  padding: 5px 10px; border-radius: var(--r-sm);
  border: 1px solid var(--rule-strong);
  background: var(--surface); color: var(--ink);
  min-width: 210px; flex: 1 1 210px; max-width: 340px;
}
.search::placeholder { color: var(--ink-3); }

/* ---------- decision log ------------------------------------------------- */

.log { border-top: 1px solid var(--rule-strong); }

.row { border-bottom: 1px solid var(--rule); }
.row > summary {
  display: grid;
  grid-template-columns: 84px minmax(0, 1fr) 92px 92px 88px 104px;
  gap: var(--sp-3);
  align-items: center;
  padding: var(--sp-3) var(--sp-2);
  cursor: pointer;
  list-style: none;
  transition: background var(--dur) var(--ease);
}
.row > summary::-webkit-details-marker { display: none; }
.row > summary:hover { background: var(--surface-2); }
.row[open] > summary { background: var(--surface-2); }

.st {
  font-family: var(--font-mono); font-size: var(--fs-micro);
  font-weight: 600; letter-spacing: 0.05em;
  padding: 2px 6px; border-radius: var(--r-sm);
  border: 1px solid currentColor; text-align: center;
  white-space: nowrap;
}
.st[data-s="settled"]  { color: var(--ok); }
.st[data-s="open"]     { color: var(--accent); }
.st[data-s="no_trade"] { color: var(--ink-3); }
.st[data-s="void"]     { color: var(--ink-3); }
.st[data-s="forecast_failed"] { color: var(--danger); background: var(--danger-dim); }

.q {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--ink);
}
.cell {
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  text-align: right; font-size: var(--fs-label); color: var(--ink);
}
.cell .k {
  display: block; font-family: var(--font-ui); font-size: var(--fs-micro);
  color: var(--ink-3); font-weight: 500;
}
.pos { color: var(--ok); }
.neg { color: var(--danger); }

/* expanded body */
.detail {
  padding: var(--sp-4) var(--sp-2) var(--sp-5);
  background: var(--surface-2);
  display: grid; gap: var(--sp-4);
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
}
.detail h3 {
  margin: 0 0 var(--sp-2); font-size: var(--fs-label); font-weight: 600;
  color: var(--ink-3);
}
.detail .full-q { font-weight: 600; margin-bottom: var(--sp-3); }
.reasoning {
  color: var(--ink-2); margin: 0;
  max-width: 72ch; text-wrap: pretty;
}
.verdict {
  margin-top: var(--sp-3);
  padding: var(--sp-3);
  border: 1px solid var(--rule-strong);
  border-radius: var(--r-md);
  background: var(--inset);
  font-family: var(--font-mono); font-size: var(--fs-label);
}
.verdict .lead {
  font-family: var(--font-ui); font-size: var(--fs-micro);
  color: var(--ink-3); display: block; margin-bottom: var(--sp-1);
}
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px var(--sp-4); align-items: baseline; }
.kv dt { color: var(--ink-3); font-size: var(--fs-label); }
.kv dd {
  margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  font-size: var(--fs-label); text-align: right;
}

/* ---------- empty state: a measurement, not a malfunction ---------------- */

.empty {
  padding: var(--sp-6) var(--sp-5);
  border: 1px dashed var(--rule-strong);
  border-radius: var(--r-md);
  background: var(--surface);
}
.empty h3 { margin: 0 0 var(--sp-2); font-size: var(--fs-section); font-weight: 600; }
.empty p { margin: 0 0 var(--sp-3); color: var(--ink-2); max-width: 68ch; text-wrap: pretty; }
.empty p:last-child { margin-bottom: 0; }
.empty .facts {
  display: flex; gap: var(--sp-6); flex-wrap: wrap;
  margin-top: var(--sp-4); padding-top: var(--sp-4);
  border-top: 1px solid var(--rule);
  font-size: var(--fs-label); color: var(--ink-3);
}
.empty .facts b {
  display: block; color: var(--ink); font-weight: 600;
  font-family: var(--font-mono); font-size: var(--fs-body);
}

footer {
  margin-top: var(--sp-7); padding: var(--sp-5) 0 var(--sp-7);
  border-top: 1px solid var(--rule);
  color: var(--ink-3); font-size: var(--fs-label);
}
footer code {
  font-family: var(--font-mono); font-size: var(--fs-micro);
  background: var(--inset); padding: 1px 5px; border-radius: var(--r-sm);
}

/* ---------- responsive --------------------------------------------------- */

@media (max-width: 900px) {
  .detail { grid-template-columns: minmax(0, 1fr); }
  .row > summary { grid-template-columns: 78px minmax(0, 1fr) 88px 96px; }
  .row > summary .hide-md { display: none; }
}
@media (max-width: 620px) {
  .wrap { padding: 0 var(--sp-4); }
  /* Right-aligned meta is what pushed the page wider than the viewport.
     Below this width it stacks instead of competing for the same line. */
  .sec-head .grow { display: none; }
  .sec-head .note { flex: 1 1 100%; }
  .arm-stats { margin-left: 0; flex: 1 1 100%; gap: var(--sp-4); }
  .axis-ends .mid { display: none; }
  .masthead { padding-bottom: var(--sp-3); }
  .row > summary {
    grid-template-columns: 78px minmax(0, 1fr);
    row-gap: var(--sp-2);
  }
  .row > summary .hide-sm { display: none; }
  .q { white-space: normal; }
  .hb-meta { width: 100%; gap: var(--sp-4); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
  .hb-dot::after { display: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="masthead">
    <h1>Cassandra</h1>
    <span class="sub" id="masthead-sub">forward paper-trading test</span>
  </header>

  <div class="heartbeat" id="heartbeat" data-state="dead" role="status" aria-live="polite">
    <span class="hb-dot" aria-hidden="true"></span>
    <span class="hb-verdict" id="hb-verdict">LOADING</span>
    <span class="hb-detail" id="hb-detail">reading summary.json</span>
    <span class="hb-spacer"></span>
    <span class="hb-meta" id="hb-meta"></span>
  </div>

  <div class="mode" id="mode" data-mode="shadow" hidden>
    <span class="badge" id="mode-badge">SHADOW</span>
    <span id="mode-text"></span>
  </div>

  <section id="perf-section">
    <div class="sec-head">
      <h2>Return</h2>
      <span class="note">90% interval, event-clustered bootstrap</span>
      <span class="grow"></span>
      <span class="note">computed in Python, not here</span>
    </div>
    <div id="perf"></div>
  </section>

  <section id="log-section">
    <div class="sec-head">
      <h2>Decisions</h2>
      <span class="note" id="log-note"></span>
    </div>
    <div class="filters" id="filters"></div>
    <div class="log" id="log"></div>
  </section>

  <footer>
    <span id="foot-model"></span>
    Every figure is read verbatim from <code>summary.json</code>; the browser computes
    no P&amp;L, ROI, or confidence interval. Source:
    <a href="https://github.com/akhilc08/cassandra">akhilc08/cassandra</a>.
  </footer>
</div>

<script>
(function () {
  "use strict";

  var HOUR = 3600e3;
  var STALE_WARN_H = 36, STALE_ERR_H = 72;

  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  };

  function pct(x, digits) {
    if (x == null || isNaN(x)) return "—";
    var d = digits == null ? 1 : digits;
    return (x >= 0 ? "+" : "") + (x * 100).toFixed(d) + "%";
  }
  function money(x) {
    if (x == null || isNaN(x)) return "—";
    return (x >= 0 ? "+$" : "-$") + Math.abs(x).toLocaleString("en-US", { maximumFractionDigits: 0 });
  }
  function since(ms) {
    if (!isFinite(ms)) return "unknown";
    var h = ms / HOUR;
    if (h < 1) return Math.max(1, Math.round(ms / 60000)) + " min ago";
    if (h < 48) return Math.round(h) + "h ago";
    return Math.round(h / 24) + " days ago";
  }
  function parseTs(s) {
    if (!s) return NaN;
    var t = Date.parse(s);
    return isNaN(t) ? NaN : t;
  }

  /* ---- data loading; both files may legitimately be absent or empty ---- */

  function loadJSON(path) {
    return fetch(path, { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });
  }
  function loadJSONL(path) {
    return fetch(path, { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text() : ""; })
      .catch(function () { return ""; })
      .then(function (txt) {
        var out = [];
        (txt || "").split("\n").forEach(function (line) {
          line = line.trim();
          if (!line) return;
          try { out.push(JSON.parse(line)); } catch (e) { /* skip partial line */ }
        });
        return out;
      });
  }

  /* ---- heartbeat ------------------------------------------------------- */

  function renderHeartbeat(summary) {
    var hb = $("heartbeat");
    var gen = summary ? parseTs(summary.generated_at) : NaN;
    var age = isFinite(gen) ? (Date.now() - gen) : Infinity;
    var hrs = age / HOUR;

    var state, verdict, detail;
    if (!summary) {
      state = "dead"; verdict = "NO SIGNAL";
      detail = "summary.json could not be read. The pipeline has not published a run.";
    } else if (hrs > STALE_ERR_H) {
      state = "dead"; verdict = "NO SIGNAL";
      detail = "Last run " + since(age) + ". The daily job runs at 09:17 UTC, so this is "
             + "overdue by more than two cycles; assume it is broken.";
    } else if (hrs > STALE_WARN_H) {
      state = "warn"; verdict = "STALE";
      detail = "Last run " + since(age) + ". One cycle has been missed.";
    } else {
      state = "live"; verdict = "LIVE";
      detail = "Last run " + since(age) + ".";
    }
    hb.setAttribute("data-state", state);
    $("hb-verdict").textContent = verdict;
    $("hb-detail").innerHTML = "";
    $("hb-detail").appendChild(document.createTextNode(detail));

    var meta = $("hb-meta");
    meta.innerHTML = "";
    if (summary) {
      var pairs = [
        ["decisions", String(summary.n_decisions != null ? summary.n_decisions : 0)],
        ["volume floor", "$" + Math.round((summary.min_volume || 0) / 1000) + "k"]
      ];
      var failed = (summary.counts || {}).forecast_failed || 0;
      if (failed) pairs.push(["forecast failures", String(failed)]);
      pairs.forEach(function (p) {
        var s = el("span", null);
        s.appendChild(el("b", null, p[1]));
        s.appendChild(document.createTextNode(p[0]));
        meta.appendChild(s);
      });
    }
  }

  /* ---- mode banner ----------------------------------------------------- */

  function renderMode(summary) {
    if (!summary) return;
    var node = $("mode");
    var mode = summary.mode === "official" ? "official" : "shadow";
    node.hidden = false;
    node.setAttribute("data-mode", mode);
    $("mode-badge").textContent = mode.toUpperCase();
    $("mode-text").textContent = mode === "official"
      ? "Pre-registered test. Parameters are frozen and these results count toward the verdict."
      : "Not the pre-registered test. Decisions are logged and priced, but the universe is "
      + "off-distribution and nothing here counts toward the verdict.";
  }

  /* ---- interval bars ---------------------------------------------------- */

  function collectIntervals(summary) {
    var rows = [];
    ["official", "shadow"].forEach(function (m) {
      var r = summary && summary[m];
      if (r && r.n_settled) {
        rows.push({
          name: m, qual: r.n_settled + " settled, " + (r.n_clusters || 0) + " clusters",
          roi: r.roi, lo: r.roi_ci_low, hi: r.roi_ci_high,
          pnl: r.total_pnl, win: r.win_rate, mode: m
        });
      }
    });
    var b = summary && summary.baseline;
    if (b && b.test_ci_90) {
      rows.push({
        name: "backtest baseline", qual: "claude-fable-5, no volume floor",
        roi: b.test_roi, lo: b.test_ci_90[0], hi: b.test_ci_90[1],
        pnl: null, win: null, mode: "baseline", note: b.note
      });
    }
    return rows;
  }

  function renderPerf(summary) {
    var host = $("perf");
    host.innerHTML = "";
    var rows = collectIntervals(summary);

    var live = rows.filter(function (r) { return r.mode !== "baseline"; });
    if (!live.length) {
      var p = el("div", "pending");
      p.appendChild(el("div", "lead", "No settled trades to report."));
      p.appendChild(el("p", null,
        "A return figure appears once positions resolve. Until then the only honest "
        + "thing to show is the backtest interval this test exists to check."));
      host.appendChild(p);
    }
    if (!rows.length) return;

    // Shared axis across every interval. Always include zero.
    var lo = 0, hi = 0;
    rows.forEach(function (r) {
      if (r.lo != null) lo = Math.min(lo, r.lo);
      if (r.hi != null) hi = Math.max(hi, r.hi);
    });
    var pad = (hi - lo) * 0.06 || 0.05;
    lo -= pad; hi += pad;
    var span = (hi - lo) || 1;
    var x = function (v) { return ((v - lo) / span) * 100; };

    rows.forEach(function (r) {
      var arm = el("div", "arm");

      var top = el("div", "arm-top");
      var nm = el("span", "arm-name");
      nm.appendChild(document.createTextNode(r.name));
      nm.appendChild(el("span", "qual", "  " + r.qual));
      top.appendChild(nm);

      var stats = el("span", "arm-stats");
      function stat(label, value, cls) {
        var s = el("span", null);
        var b = el("b", cls || null, value);
        s.appendChild(b);
        s.appendChild(document.createTextNode(" " + label));
        stats.appendChild(s);
      }
      if (r.pnl != null) stat("P&L", money(r.pnl), r.pnl >= 0 ? "pos" : "neg");
      if (r.win != null) stat("win rate", (r.win * 100).toFixed(0) + "%");
      top.appendChild(stats);
      arm.appendChild(top);

      var axis = el("div", "axis");
      axis.appendChild(el("div", "axis-line"));

      var straddles = (r.lo != null && r.hi != null && r.lo <= 0 && r.hi >= 0);

      var band = el("div", "band");
      band.style.left = x(r.lo) + "%";
      band.style.width = Math.max(0.6, x(r.hi) - x(r.lo)) + "%";
      band.setAttribute("data-straddles", straddles ? "yes" : "no");
      band.setAttribute("data-mode", r.mode);
      band.setAttribute("role", "img");
      band.setAttribute("aria-label",
        r.name + ": ROI " + pct(r.roi) + ", 90% interval " + pct(r.lo) + " to " + pct(r.hi)
        + (straddles ? ", crosses zero" : ", clear of zero"));
      axis.appendChild(band);

      var zero = el("div", "zero");
      zero.style.left = x(0) + "%";
      axis.appendChild(zero);

      var tick = el("div", "tick");
      tick.style.left = x(r.roi) + "%";
      axis.appendChild(tick);

      var lab = el("div", "tick-label", pct(r.roi));
      lab.style.left = x(r.roi) + "%";
      if (x(r.roi) > 78) { lab.style.transform = "translateX(-100%)"; }
      if (x(r.roi) < 12) { lab.style.transform = "translateX(0)"; }
      axis.appendChild(lab);
      arm.appendChild(axis);

      var ends = el("div", "axis-ends");
      ends.appendChild(el("span", null, pct(r.lo) + " low"));
      ends.appendChild(el("span", "mid",
        straddles ? "interval crosses zero" : "interval clear of zero"));
      ends.appendChild(el("span", null, pct(r.hi) + " high"));
      arm.appendChild(ends);

      if (r.note) {
        var n = el("div", null, r.note);
        n.style.color = "var(--ink-3)";
        n.style.fontSize = "var(--fs-label)";
        n.style.marginTop = "var(--sp-2)";
        n.style.maxWidth = "72ch";
        arm.appendChild(n);
      }
      host.appendChild(arm);
    });
  }

  /* ---- the verdict line: which rule bound this decision ----------------- */

  function verdictFor(d) {
    // Thresholds come from the record itself, so this explanation cannot drift
    // from the parameters the runner actually applied.
    var p = d.params || {};
    var tau = p.threshold != null ? p.threshold : 0.08;
    var cap = p.max_divergence != null ? p.max_divergence : 0.35;
    var lo = p.min_price != null ? p.min_price : 0.03;
    var hi = p.max_price != null ? p.max_price : 0.97;
    var mkt = d.p_market_mid, edge = d.edge;

    if (d.status === "forecast_failed") {
      return "Forecast failed, so the market was skipped. A failed forecast must never "
           + "reach the strategy layer: its sentinel p=0.50 would fabricate an edge.";
    }
    if (mkt != null && (mkt < lo || mkt > hi)) {
      return "price " + mkt.toFixed(3) + " outside " + lo + "–" + hi + " bounds";
    }
    if (edge != null && Math.abs(edge) > cap) {
      return "|edge| " + Math.abs(edge).toFixed(3) + " > " + cap + " divergence cap "
           + "(disagreement this wide usually means the model misread the question)";
    }
    if (edge != null && Math.abs(edge) < tau) {
      return "|edge| " + Math.abs(edge).toFixed(3) + " < " + tau + " threshold";
    }
    if (edge != null) {
      return "|edge| " + Math.abs(edge).toFixed(3) + " inside the " + tau + "–" + cap
           + " band, so it traded " + String(d.side || "").toUpperCase();
    }
    return "no decision recorded";
  }

  /* ---- decision log ----------------------------------------------------- */

  var ORDER = ["settled", "open", "no_trade", "forecast_failed", "void"];
  var state = { status: "all", q: "" };
  var DECISIONS = [];

  function renderFilters() {
    var host = $("filters");
    host.innerHTML = "";
    var counts = {};
    DECISIONS.forEach(function (d) {
      counts[d.status] = (counts[d.status] || 0) + 1;
    });

    function chip(key, label, n) {
      var b = el("button", "chip");
      b.type = "button";
      b.setAttribute("aria-pressed", String(state.status === key));
      b.appendChild(document.createTextNode(label));
      if (n != null) b.appendChild(el("span", "n", String(n)));
      b.addEventListener("click", function () {
        state.status = key;
        renderFilters();
        renderLog();
      });
      host.appendChild(b);
    }

    chip("all", "All", DECISIONS.length);
    ORDER.forEach(function (s) {
      if (counts[s]) chip(s, s.replace("_", " "), counts[s]);
    });

    var input = el("input", "search");
    input.type = "search";
    input.placeholder = "Search questions";
    input.setAttribute("aria-label", "Search decisions by question");
    input.value = state.q;
    input.addEventListener("input", function () {
      state.q = input.value.toLowerCase();
      renderLog();
    });
    host.appendChild(input);
  }

  function visible() {
    return DECISIONS.filter(function (d) {
      if (state.status !== "all" && d.status !== state.status) return false;
      if (state.q && String(d.question || "").toLowerCase().indexOf(state.q) === -1) return false;
      return true;
    });
  }

  function cell(label, value, cls) {
    var c = el("div", "cell" + (cls ? " " + cls : ""));
    c.appendChild(document.createTextNode(value));
    c.appendChild(el("span", "k", label));
    return c;
  }

  function renderLog() {
    var host = $("log");
    host.innerHTML = "";
    var rows = visible();

    $("log-note").textContent = DECISIONS.length
      ? rows.length + " of " + DECISIONS.length + " shown, newest first"
      : "";

    if (!DECISIONS.length) { host.appendChild(emptyState()); return; }
    if (!rows.length) {
      var none = el("div", "pending");
      none.appendChild(el("div", "lead", "No decisions match this filter."));
      host.appendChild(none);
      return;
    }

    rows.forEach(function (d) {
      var row = el("details", "row");
      var sum = el("summary");

      var st = el("span", "st", (d.status || "?").replace("_", " "));
      st.setAttribute("data-s", d.status);
      sum.appendChild(st);

      sum.appendChild(el("span", "q", d.question || "(no question)"));

      sum.appendChild(cell("model", d.p_model != null ? d.p_model.toFixed(2) : "—"));
      sum.appendChild(cell("market", d.p_market_mid != null ? d.p_market_mid.toFixed(2) : "—"));

      var edgeCell = cell("edge", d.edge != null ? (d.edge >= 0 ? "+" : "") + d.edge.toFixed(3) : "—");
      edgeCell.classList.add("hide-md");
      sum.appendChild(edgeCell);

      var last;
      if (d.status === "settled") {
        last = cell("P&L", money(d.pnl), d.pnl >= 0 ? "pos" : "neg");
      } else if (d.status === "open") {
        last = cell("at", d.entry_cost != null ? d.entry_cost.toFixed(3) + "¢" : "—");
      } else {
        last = cell("vol", d.volume ? "$" + Math.round(d.volume / 1000) + "k" : "—");
      }
      last.classList.add("hide-sm");
      sum.appendChild(last);
      row.appendChild(sum);

      var body = el("div", "detail");

      var left = el("div");
      left.appendChild(el("div", "full-q", d.question || ""));
      left.appendChild(el("h3", null, "Model reasoning"));
      left.appendChild(el("p", "reasoning", d.reasoning || "(none recorded)"));

      var v = el("div", "verdict");
      v.appendChild(el("span", "lead", "Why this outcome"));
      v.appendChild(document.createTextNode(verdictFor(d)));
      left.appendChild(v);
      body.appendChild(left);

      var right = el("div");
      right.appendChild(el("h3", null, "Record"));
      var dl = el("dl", "kv");
      function kv(k, val) {
        if (val == null || val === "") return;
        dl.appendChild(el("dt", null, k));
        dl.appendChild(el("dd", null, String(val)));
      }
      kv("decided", (d.ts_decision || "").replace("T", " ").slice(0, 16));
      kv("closes", (d.end_date || "").replace("T", " ").slice(0, 16));
      kv("mode", d.mode);
      kv("volume", d.volume ? "$" + Math.round(d.volume).toLocaleString("en-US") : null);
      kv("evidence", d.evidence_strength);
      kv("wiki events", d.n_wiki_events);
      kv("p(model)", d.p_model != null ? d.p_model.toFixed(3) : null);
      kv("p(market mid)", d.p_market_mid != null ? d.p_market_mid.toFixed(3) : null);
      kv("edge", d.edge != null ? d.edge.toFixed(3) : null);
      if (d.book) {
        kv("yes bid / ask", d.book.yes_bid != null
          ? d.book.yes_bid.toFixed(3) + " / " + d.book.yes_ask.toFixed(3) : null);
      }
      kv("side", d.side ? d.side.toUpperCase() : null);
      kv("entry (replica)", d.entry_cost != null ? d.entry_cost.toFixed(3) : null);
      kv("entry (executable)", d.executable_cost != null ? d.executable_cost.toFixed(3) : null);
      kv("stake", d.stake ? "$" + d.stake.toFixed(0) : null);
      kv("resolved", d.outcome_yes == null ? null : (d.outcome_yes ? "YES" : "NO"));
      kv("P&L", d.pnl != null ? money(d.pnl) : null);
      kv("P&L (executable)", d.pnl_executable != null ? money(d.pnl_executable) : null);
      kv("cluster", d.cluster_key);
      kv("model", d.model);
      right.appendChild(dl);
      body.appendChild(right);

      row.appendChild(body);
      host.appendChild(row);
    });
  }

  function emptyState() {
    var e = el("div", "empty");
    e.appendChild(el("h3", null, "No market has cleared the floor."));
    e.appendChild(el("p", null,
      "The scan runs daily and only considers markets above the volume floor, closing "
      + "12 to 36 hours out. That is a deliberately narrow gate: the backtest edge lives "
      + "entirely in liquid markets, and the one thin bucket it measured lost 85%."));
    e.appendChild(el("p", null,
      "Roughly 1.3 markets a day clear the floor, so days with no decisions are the "
      + "expected case rather than a fault. The heartbeat above is what tells you "
      + "whether the pipeline is actually running."));
    var f = el("div", "facts");
    [["~1.3 / day", "qualify at the floor"],
     ["~18 / month", "expected decisions"],
     ["09:17 UTC", "daily scan"]].forEach(function (p) {
      var s = el("span", null);
      s.appendChild(el("b", null, p[0]));
      s.appendChild(document.createTextNode(p[1]));
      f.appendChild(s);
    });
    e.appendChild(f);
    return e;
  }

  /* ---- boot ------------------------------------------------------------- */

  Promise.all([loadJSON("./summary.json"), loadJSONL("./decisions.jsonl")])
    .then(function (res) {
      var summary = res[0], decisions = res[1] || [];

      decisions.sort(function (a, b) {
        return String(b.ts_decision || "").localeCompare(String(a.ts_decision || ""));
      });
      DECISIONS = decisions;

      renderHeartbeat(summary);
      renderMode(summary);
      renderPerf(summary);
      renderFilters();
      renderLog();

      if (summary) {
        $("masthead-sub").textContent =
          summary.model + " · vol ≥ $"
          + Math.round((summary.min_volume || 0) / 1000) + "k · flat $100";
        $("foot-model").textContent = "Forecaster " + summary.model + ", market-blind. ";
      }
    })
    .catch(function (err) {
      renderHeartbeat(null);
      $("log").appendChild(emptyState());
      if (window.console) console.error(err);
    });
})();
</script>
</body>
</html>
